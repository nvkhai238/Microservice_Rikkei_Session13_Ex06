server:
  port: 8888
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8080
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/products/**
              filters:
                - StripPrefix=1
