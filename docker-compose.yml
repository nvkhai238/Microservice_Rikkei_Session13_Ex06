services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "${DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - identity_data:/var/lib/postgresql/data
volumes:
  identity_data:
